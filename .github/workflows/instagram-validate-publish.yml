name: OM Radar - valider et publier Instagram

on:
  workflow_dispatch:
    inputs:
      approve:
        description: "Je confirme avoir vérifié le visuel et je demande sa publication"
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: om-radar-instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    if: inputs.approve
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Publier le brouillon explicitement validé
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          CONFIRM_PUBLISH: "oui"
        run: python scripts/publish_approved.py
      - name: Enregistrer l'état de publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pending.json data/published.json
          if git diff --cached --quiet; then
            echo "Aucun changement d'état à enregistrer."
          else
            git commit -m "Record approved Instagram publication [skip ci]"
            git push
          fi
  not-approved:
    if: ${{ !inputs.approve }}
    runs-on: ubuntu-latest
    steps:
      - name: Ne rien publier
        run: echo "Publication annulée : aucune confirmation explicite."
