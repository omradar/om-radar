name: OM Radar Instagram approval

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Enter PUBLISH only after checking the image"
        required: true
        type: string
        default: "NO"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Stop unless explicitly approved
        if: ${{ inputs.confirmation != 'PUBLISH' }}
        run: echo "No publication: confirmation is not PUBLISH."

      - name: Checkout repository
        if: ${{ inputs.confirmation == 'PUBLISH' }}
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Publish approved draft
        if: ${{ inputs.confirmation == 'PUBLISH' }}
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          CONFIRM_PUBLISH: "oui"
        run: python scripts/publish_approved.py

      - name: Save publication state
        if: ${{ inputs.confirmation == 'PUBLISH' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pending.json data/published.json
          if git diff --cached --quiet; then
            echo "No publication state changes to save."
          else
            git commit -m "Record approved Instagram publication [skip ci]"
            git push
          fi
