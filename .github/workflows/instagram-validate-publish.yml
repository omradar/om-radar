name: OM Radar Instagram approval

on: [workflow_dispatch]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check explicit approval
        env:
          APPROVAL: ${{ inputs.confirmation }}
        run: |
          if [ "$APPROVAL" != "PUBLISH" ]; then
            echo "Approval not given; nothing will be published."
            exit 0
          fi
      - name: Checkout repository
        if: ${{ inputs.confirmation == 'PUBLISH' }}
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Publish approved draft
        if: ${{ inputs.confirmation == 'PUBLISH' }}
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          CONFIRM_PUBLISH: "oui"
        run: python scripts/publish_approved.py
      - name: Save publication state
        if: ${{ inputs.confirmation == 'PUBLISH' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pending.json data/published.json
          if git diff --cached --quiet; then
            echo "No publication state changes to save."
          else
            git commit -m "Record approved Instagram publication [skip ci]"
            git push
          fi
