name: OM Radar — valider et publier Instagram

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: "As-tu vérifié l'image et confirmes-tu sa publication ?"
        type: choice
        required: true
        default: "non"
        options:
          - "non"
          - "oui, je valide et publie"

permissions:
  contents: write

concurrency:
  group: om-radar-instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    if: inputs.confirm_publish == 'oui, je valide et publie'
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Publier le brouillon explicitement validé
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          CONFIRM_PUBLISH: ${{ inputs.confirm_publish == 'oui, je valide et publie' && 'oui' || 'non' }}
        run: python scripts/publish_approved.py
      - name: Enregistrer l'état de publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pending.json data/published.json
          if git diff --cached --quiet; then
            echo "Aucun changement d'état à enregistrer."
          else
            git commit -m "Record approved Instagram publication [skip ci]"
            git push
          fi
  not-approved:
    if: inputs.confirm_publish != 'oui, je valide et publie'
    runs-on: ubuntu-latest
    steps:
      - name: Ne rien publier
        run: echo "Publication annulée : sélectionne explicitement oui après vérification du visuel."
