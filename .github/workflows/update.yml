name: Mise à jour du site

on:
  schedule:
    # Toutes les 3 heures, tous les jours (heure UTC)
    - cron: "15 */3 * * *"
  workflow_dispatch: # bouton « Run workflow » pour lancer à la main
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mémoire des photos et adresses déjà trouvées
        uses: actions/cache@v4
        with:
          path: cache
          key: news-cache-${{ github.run_id }}
          restore-keys: news-cache-
      - name: Générer le site
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
