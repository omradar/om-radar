name: OM Radar — préparer une carte Instagram

on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: om-radar-instagram-draft
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: python -m pip install --disable-pip-version-check feedparser pillow
      - name: Préparer le brouillon
        id: prepare
        run: python scripts/prepare_post.py
      - name: Enregistrer le brouillon dans GitHub
        if: steps.prepare.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram-posts/ data/pending.json data/published.json
          if git diff --cached --quiet; then
            echo "Aucun nouveau fichier à enregistrer."
          else
            git commit -m "Prepare Instagram draft [skip ci]"
            git push
          fi
